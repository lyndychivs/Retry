name: Mutation Testing with Stryker.NET
run-name: Mutation Testing with Stryker.NET
permissions:
  contents: read
on:
    push:
    schedule:
      - cron: "0 4 * * SUN"
jobs:
  dotnet-stryker-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Stryker.NET
        uses: lyndychivs/dotnet-stryker-action@v1.6
        with:
          configurationFile: "stryker-config.json"
          dashboardApiKey: ${{ secrets.STRYKER_DASHBOARD }}
          version: ${{ github.ref_name }}
